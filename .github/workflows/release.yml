name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Select the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable
      - name: Check version and test
        run: |
          $version = (cargo pkgid --locked).Split('@')[-1]
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME must match Cargo package version $version."
          }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows x64
        run: ./tools/build-release.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RenderLatch-windows-x64
          path: dist/RenderLatch-windows-x64.exe*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: RenderLatch-windows-x64
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum -c RenderLatch-windows-x64.exe.sha256
          gh release create "$TAG" RenderLatch-windows-x64.exe RenderLatch-windows-x64.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "RenderLatch $TAG" --generate-notes
